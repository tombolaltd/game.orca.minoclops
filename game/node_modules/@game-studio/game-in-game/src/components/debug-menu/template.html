<div class="debug-menu">
    <label class="label">Serve from:</label>
    <input
        id="debug-host"
        v-model="host"
        class="input"
        type="text"
        placeholder="192.168.13.124:9003"
        @input="emitHost"
    />
    <input
        id="use-debug-url"
        v-model="useDebugUrl"
        class="checkbox"
        type="checkbox"
        @change="emitUseDebugUrl"
    />
</div>
