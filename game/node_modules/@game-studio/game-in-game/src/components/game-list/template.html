<div class="game-list"
    :class="{ [`${deviceType}`]: true, [`${orientation}`]: true, [`${displayMode}`]: true, 'visible' : visible }">
    <div class="category" v-for="category in games">
        <div class="title">{{ category.Name }}</div>
        <div class="games">
            <img class="game-launcher" :src="game.LauncherUrl" v-for="game in category.Games"
                @click="onOpenGame(game)" />
        </div>
    </div>
</div>
