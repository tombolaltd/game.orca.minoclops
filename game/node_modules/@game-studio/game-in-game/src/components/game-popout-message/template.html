<div class="game-popout-message-container" :class="{ visible: visible }">
    <div class="game-popout-message" :class="{ visible: visible }">
        <div class="close-icon" @click="onClose()">
            <svg-icon icon="close"></svg-icon>
        </div>
        <div class="title">
            {{title}}
        </div>
        <div class="message">
            {{message}}
        </div>
        <button class="button" @click="onOpen()">
            {{buttonText}}
        </button>
    </div>
</div>
