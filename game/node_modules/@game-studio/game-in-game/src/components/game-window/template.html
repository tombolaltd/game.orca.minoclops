<div class="game-window" :class="{ [`${orientation}`]: true, [`${displayMode}`]: true, 'visible': visible }">
    <div class="game-controls" v-if="showControls">
        <div :class="{ 'popout-game-icon': true, 'visible': canPopout }" @click="onPopout()">
            <svg-icon icon="open"></svg-icon>
        </div>
        <div class="game-name">
            {{ gameName }}
        </div>
        <div class="close-game-icon" @click="onClose()">
            <svg-icon icon="close"></svg-icon>
        </div>
    </div>
    <div class="game-view" :class="{ 'visible': visible }">
        <div class="game-error" v-if="errorMessage">
            <div class="game-error-title">Unable to load game</div>
            <div class="game-error-message">{{ errorMessage }}</div>
        </div>
        <slot></slot>
    </div>
</div>
</div>
