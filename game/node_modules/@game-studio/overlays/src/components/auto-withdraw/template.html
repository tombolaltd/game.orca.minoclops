<div class="popup" v-show="isVisible"
    :style="{ '--themeFont': theme.fontName, '--themeColour': theme.midAccent.string }">
    <div class="container">
        <h3 class="header">{{title}}</h3>
        <p class="message">{{message}}</p>
        <button class="button" @click="close">{{button}}</button>
    </div>
</div>
