<div class="bonus-in-play" v-show="isVisible"
    :style="{ 
        '--themeFont': theme.fontName, 
        '--headingColor': headingColor,
        '--bodyColor': bodyColor,
    }">
    <div class="container">
        <p class="header">{{ title }}</p>
        <p class="message">{{ message }}</p>
        <button class="button" v-if="showPlayButton" :style="primaryButtonStyle" @click="onPlay">{{ btnLabel }}</button>
        <button class="button" v-if="showCancelButton" :style="secondaryButtonStyle" @click="onCancel">Cancel</button>
    </div>
</div>
