<div class="cooloff-window" v-show="isVisible" :style="{ 
        '--themeFont': theme.fontName, 
        '--headingColor': headingColor,
        '--bodyColor': bodyColor,
    }">
    <div class="container">
        <h3 class="header">Time to take a break</h3>
        <p class="message">You are in a Cool Off period and won't be able to access tombola until the period has
            completed.</p>
        <button class="button" :style="primaryButtonStyle" @click="onClose">Close game</button>
    </div>
</div>
