<div class="overlay background demo-messaging-overlay" :class="[deviceType]" v-show="isVisible && !inSettings" :style="{ 'height': viewHeight + 'px' }">
    <div class="overlay-container">
        <div class="header">{{title}}</div>
        <div class="message">{{message}}</div>
        <button class="overlay-button" @click="onClick">{{button}}</button>
    </div>
</div>
