<div class="overlay free-play-root" :class="{ portrait: isPortrait, landscape: !isPortrait, desktop: deviceType }"
    v-show="(!inSettings || onDesktop) && isVisible" :style="{
        '--themeFont': theme.fontName,
        '--headingColor': headingColor,
        '--bodyColor': bodyColor,
        '--iconColor': headingColor
    }">
    <div class="background free-play-overlay" :class="[deviceType]">
        <div class="overlay-container" v-show="onStartPage">
            <div class="icon" :style="{ 'maskImage': `url(${icon()})`, 'WebkitMaskImage': `url(${icon()})` }"></div>
            <div class="message-content">
                <div class="center-vertical">
                    <div class="header">{{startTitle}}</div>
                    <div class="content">{{startContent}}</div>
                    <div class="content">{{startContentEnd}}</div>
                </div>
            </div>
            <button class="overlay-button" :class="{ disabled: awaitingResponse }" :disabled="awaitingResponse"
                :style="primaryButtonStyle" @click="openGame">{{confirm}}</button>
            <div class="content tandcs" @click="openTandCs">{{startContentMid}}</div>
        </div>
        <div class="overlay-container" v-show="!onStartPage">
            <div class="icon" :style="{ 'maskImage': `url(${icon()})`, 'WebkitMaskImage': `url(${icon()})` }"></div>
            <div class="message-content">
                <div class="center-vertical">
                    <div class="header">{{endTitle}}</div>
                    <div class="content">{{endContentMid}}</div>
                    <div class="content">{{endContentEnd}}</div>
                </div>
            </div>
            <button class="overlay-button" :class="{ disabled: awaitingResponse }" :disabled="awaitingResponse"
                :style="primaryButtonStyle" @click="closeEndFreePlay">{{continueText}}</button>
        </div>
    </div>
</div>
