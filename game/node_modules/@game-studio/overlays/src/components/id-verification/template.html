<div class="id-verification" v-show="isVisible"
    :style="{ 
        '--themeFont': theme.fontName, 
        '--headingColor': headingColor,
        '--bodyColor': bodyColor,
    }">
    <div class="container">
        <h3 class="header">{{translations.header}}</h3>
        <p class="message">{{translations.message}}</p>
        <button class="button verify" :style="primaryButtonStyle" @click="onGoToIdVerifyPage">{{translations.yes}}</button>
        <button class="button no" :style="secondaryButtonStyle" @click="onClose">{{translations.no}}</button>
    </div>
</div>
