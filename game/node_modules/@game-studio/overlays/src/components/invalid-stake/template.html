<div class="invalid-stake" v-show="isVisible" :style="{ 
        '--themeFont': theme.fontName, 
        '--themeColour': theme.midAccent.string,
        '--headingColor': headingColor,
        '--bodyColor': bodyColor,
        '--crossButtonOutline': crossButtonOutline,
        '--crossButtonShadow': crossButtonShadow
    }">
    <div class="container">
        <button class="close-button" @click="close" aria-label="Close">
            <span class="close-icon">×</span>
        </button>
        <h3 class="title">{{title}}</h3>
        <div class="message">
            <span v-html="displayMessage"></span>
        </div>
    </div>
</div>
