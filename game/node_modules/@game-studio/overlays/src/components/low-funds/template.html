<div class="low-funds" v-show="isVisible"
    :style="{ 
        '--themeFont': theme.fontName, 
        '--headingColor': headingColor,
        '--bodyColor': bodyColor,
    }">
    <div class="container">
        <h3 class="header">{{translations.header}}</h3>
        <p class="message">{{translations.message}}</p>
        <button class="button" :style="primaryButtonStyle" @click="onAddFunds">{{translations.yes}}</button>
        <button class="button" :style="secondaryButtonStyle" @click="hide">{{translations.no}}</button>
    </div>
</div>
