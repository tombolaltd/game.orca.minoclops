<div>
    <div class="nickname-overlay-container" :style="{ 'color': options.theme.midAccent.string, 'font-family': options.theme.fontName }">
        <div class="nickname-central-column">
            <span class="nickname-title" v-html="translations.title"></span>
            <span class="nickname-body">{{translations.body}}</span>
            <nickname-input class="nickname-input-container" :translation="translations.screenName" :state="state"></nickname-input>
            <nickname-requirements class="nickname-requirements-container" :state="state.requirements" :translations="translations.requirements"></nickname-requirements>
            <error-information v-if="state.error.hasErrored" class="error-information-container" :state="state.error" :translations="translations.serverErrors"></error-information>
            <submit-button class="submit-button-container" v-on:submitNickname="onSubmitNickname" :state="state" :translation="translations.submitButton"></submit-button>
        </div>
    </div>
</div>
