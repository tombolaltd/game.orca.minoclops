<div class="popup" v-show="isVisible"
    :style="{ 
        '--themeFont': theme.fontName, 
        '--headingColor': headingColor,
        '--bodyColor': bodyColor,
    }"
    :class="[deviceType]">
    <div class="container">
        <h3 class="header">{{title}}</h3>
        <p class="message">{{message}}</p>
        <button class="button" :style="primaryButtonStyle" @click="close">{{button}}</button>
    </div>
</div>
