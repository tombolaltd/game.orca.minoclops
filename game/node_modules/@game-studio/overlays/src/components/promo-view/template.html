<div class="promo-alert"
    :class="{ animate: promoInfo.isVisible, portrait: isPortrait, topPrizePromoNotification: !isPromoQualificationNotification }"
    :style="{ '--themeColour': theme.midAccent.string, ...getPromoAlertStyle() }">
    <div class="alert" @click="onAlertClick">
        <div class="message">{{ promoInfo.notificationMessage }}</div>
        <div class="more-details">{{ strings.moreDetails }}</div>
    </div>
    <div class="promo-details" :style="{ 'background-color': promoInfo.backgroundColour }" :if="promoInfo.isExpanded"
        @click="navigateToPromo">
        <div class="background"></div>
        <div class="content-container">
            <div class="promo-text" v-html="promoInfo.expandedNotificationText"></div>
            <div class="promo-text headline" v-html="promoInfo.expandedNotificationAdditionalText"></div>
        </div>
    </div>
</div>
