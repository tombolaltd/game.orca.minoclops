<div class="reality-check" v-show="isVisible"
    :style="{ 
        '--themeFont': theme.fontName, 
        '--headingColor': headingColor,
        '--bodyColor': bodyColor,
    }">
    <div class="container">
        <h3 class="title">{{title}}</h3>
        <button class="button" :style="primaryButtonStyle" @click="onSafePlay">safeplay</button>
        <button class="button" :style="secondaryButtonStyle" @click="onContinue">continue</button>
        <button class="close-link" @click="onClose">close game</button>
    </div>
</div>
