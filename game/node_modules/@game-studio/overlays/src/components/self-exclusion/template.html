<div v-if="isVisible" class="exclusion-overlay">
    <div class="exclusion-popup">
        <button class="exclusion-close-x" @click="onCloseGame">
            <span>×</span>
        </button>
        <div class="exclusion-content">
            <h2 class="exclusion-title">{{translations.header}}</h2>
            <p class="exclusion-message">{{translations.message}}</p>
            <div class="exclusion-buttons">
                <button class="exclusion-btn exclusion-close-btn" @click="onCloseGame">
                    <span>{{translations.closeGameLabel}}</span>
                </button>
                <button class="exclusion-btn exclusion-logout-btn" @click="onLogout">
                    <span>{{translations.logoutLabel}}</span>
                </button>
            </div>
        </div>
    </div>
</div>
