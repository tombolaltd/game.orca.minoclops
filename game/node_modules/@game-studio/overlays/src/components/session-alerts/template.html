<transition name="fade">
    <div v-if="isVisible" class="session-alert-overlay" @click="onCloseClick">
        <div class="alert-modal" @click.stop>
            <!-- Close button -->
            <button class="close-button" @click="onCloseClick" :aria-label="translations.closeButton">
                <span class="close-icon">×</span>
            </button>

            <!-- Content based on alert type -->
            <div class="alert-content" v-if="alertData">
                <!-- Title -->
                <h2 class="alert-title">{{ alertData.title }}</h2>

                <!-- Body text -->
                <p class="alert-body">{{ alertData.body }}</p>

                <!-- Session notification info boxes -->
                <div v-if="alertType === 'session-notification'" class="info-boxes">
                    <div class="info-box">
                        <div class="info-label">{{ alertData.timeSpentLabel }}</div>
                        <div class="info-value">{{ alertData.timeSpentValue }}</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">{{ alertData.moneySpentLabel }}</div>
                        <div class="info-value">{{ alertData.moneySpentValue }}</div>
                    </div>
                </div>

                <!-- Continue button -->
                <button class="continue-button" @click="onContinueClick">
                    {{ alertData.continueButton }}
                </button>

                <!-- Small print (for immediate logout and session notification) -->
                <p v-if="alertData.smallPrint" class="small-print">{{ alertData.smallPrint }}</p>
            </div>
        </div>
    </div>
</transition>
