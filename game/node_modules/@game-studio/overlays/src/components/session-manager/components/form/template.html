<primary-popup
        v-if="visible"
        :close-method="closeMethod"
        :close-text="translations.close">
        <form class="limit-settings-form" @submit.stop.prevent="submitForm">
            <h2>{{ translations.heading }}</h2>
            <p>{{ infoText }}</p>
            <fieldset class="inputs" :disabled="readonly">
                <input-row
                    ref="maxTime"
                    :fieldname="'maxTime'"
                    :options="maxTimeOptions"
                    :label="fieldsTranslations.maxTime"
                    :fieldHelp="helpTranslations.maxTime"
                    :selectText="fieldsTranslations.selectText"
                    :errors="errors"
                    :readonly="readonly"
                    @field-validation="onFieldValidation"
                    v-model="sessionModel.maxTime"
                    v-on="$listeners"></input-row>
                <input-row
                    ref="maxBet"
                    :fieldname="'maxBet'"
                    :options="maxBetOptions"
                    :label="maxBetLabel"
                    :fieldHelp="maxBetHelp"
                    :selectText="fieldsTranslations.selectText"
                    :errors="errors"
                    :readonly="readonly"
                    @field-validation="onFieldValidation"
                    v-model="sessionModel.maxBet"
                    v-on="$listeners"></input-row>
                <input-row
                    ref="sessionRestriction"
                    :fieldname="'sessionRestriction'"
                    :options="sessionRestrictionOptions"
                    :label="fieldsTranslations.sessionRestriction"
                    :fieldHelp="helpTranslations.sessionRestriction"
                    :errors="errors"
                    :readonly="readonly"
                    @field-validation="onFieldValidation"
                    v-model="sessionModel.sessionRestriction"
                    v-on="$listeners"></input-row>
            </fieldset>
            <div>
                <fieldset class="limit-settings-buttons" :disabled="networkPending">
                    <button v-if="readonly" type="button" @click="$emit('form-cancelled')">{{ translations.modifyButton }}</button>
                    <button type="submit">
                        {{ translations.confirmButton }}
                        <loading-component v-if="networkPending" />
                    </button>
                </fieldset>
                <p class="highlight" v-if="sessionEndedRecently && translations.sessionEndedRecently">
                    <span v-for="(item, index) in translations.sessionEndedRecently" v-bind:key="index">
                        <span v-if="item.linkAddress">
                             <a href="" @click.prevent="itemClicked(item.linkAddress)"> {{item.linkText}} </a>
                        </span>
                        <span v-else>
                            {{item}}
                        </span>
                    </span>
                </p>
            </div>
        </form>
    </primary-popup>
</template>
