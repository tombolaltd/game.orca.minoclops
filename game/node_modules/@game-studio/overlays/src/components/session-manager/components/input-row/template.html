<div class="input-row" :class="{ 'error' : errors.indexOf(fieldname) > -1 }" :disabled="readonly">
    <label :for="`limit-input-${fieldname}`">{{ label }}</label>
    <div class="select">
        <select :id="`limit-input-${fieldname}`" :name="fieldname" :value="value" v-on:change="onInput">
            <option v-if="!readonly && selectText" value="-1" disabled>{{ selectText }}</option>
            <option v-for="option in options" :value="option.value" :key="option.value">{{option.string}}</option>
        </select>
    </div>
    <p class="error" v-if="!readonly">{{ errorText }}</p>
    <button-icon v-if="!readonly" :icon="'help'" :action="onHelpClicked">{{ helpText }}</button-icon>
</div>
