<primary-popup v-if="visible" :close-method="closeMethod" :close-text="translations.close">
    <div class="session-restriction">
        <h2>{{translations.heading}}</h2>
        <div class="panel">
            <p>{{ translations.info }}</p>
            <p>{{ expiryString }}</p>
            <p class="highlight">
                <span v-for="(item, index) in translations.reminder" v-bind:key="index">
                    <span v-if="item.linkAddress">
                        <a href="" @click.prevent="itemClicked(item.linkAddress)"> {{item.linkText}} </a>
                    </span>
                    <span v-else>
                        {{item}}
                    </span>
                </span>
            </p>
        </div>
    </div>
</primary-popup>
