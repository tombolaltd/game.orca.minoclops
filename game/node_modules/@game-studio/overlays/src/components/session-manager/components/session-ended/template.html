<accept-popup v-if="visible" :close-method="onClosed" :translations="translations.progress">
    <div class="session-ended">
        <h2>{{ reasonTranslations.heading }}</h2>
        <div class="progress-details">
            <p>{{ reasonTranslations.spent }} <span>{{ currentBet }}</span></p>
            <p>{{ reasonTranslations.prizes }} <span>{{ totalWinnings }}</span></p>
            <p>{{ reasonTranslations.balance }} <span>{{ netBalance }}</span></p>
        </div>
    </div>
</accept-popup>
