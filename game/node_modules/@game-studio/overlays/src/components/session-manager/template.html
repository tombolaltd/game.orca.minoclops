<div id="session-management" class="session-management"
    :class="{ 'primary-popup-open': primaryPopupIsOpen, 'secondary-popup-open': secondaryPopupIsOpen }">

    <form-component ref="createSessionPopup"
        v-if="(!createFormPriorityAlertsVisible && !confirmationPending && !hadActiveSession && !formForceClosed)"
        v-model="sessionModel" :readonly="false" :close-method="onFormClosed" :network-pending="networkPending"
        :translations="config.translations.form" :help-translations="config.translations.help"
        :fields-translations="config.translations.fields" :duration-translations="config.translations.durations"
        :session-status="sessionStatus" :session-settings="sessionSettings"
        :session-ended-recently="sessionEndedRecently" :external-page-navigation="externalPageNavigation"
        :enable-debug-session-values="config.debugSessionValues" :suppressed="suppressForm"
        @form-submitted="onFormSubmitted" @update-help-text="onUpdateHelpText">
    </form-component>

    <form-component ref="confirmSessionPopup" v-if="confirmationPending" v-model="sessionModel" :readonly="true"
        :close-method="onModifyLimits" :network-pending="networkPending"
        :translations="config.translations.confirmation" :help-translations="config.translations.help"
        :fields-translations="config.translations.fields" :duration-translations="config.translations.durations"
        :session-status="sessionStatus" :session-settings="sessionSettings" :session-ended-recently="false"
        :enable-debug-session-values="config.debugSessionValues" @form-submitted="onConfirmationSubmitted"
        @form-cancelled="onModifyLimits">
    </form-component>

    <restriction-component ref="restrictionPopup" :close-method="onSessionRestrictedClosed"
        :suppressed="formForceClosed" :translations="config.translations.sessionRestriction"
        :session-status="sessionStatus" :external-page-navigation="externalPageNavigation"
        :session-duration="sessionDuration">
    </restriction-component>

    <progress-details ref="progressAlertPopup" :suppressed="progressAlertPopupPriorityAlertsVisible"
        :translations="config.translations.progress" :session-status="sessionStatus" :session-duration="sessionDuration"
        @alert="onAlert">
    </progress-details>

    <limit-approaching ref="limitApproachingPopup" :translations="config.translations.limitApproaching"
        :session-status="sessionStatus" :session-duration="sessionDuration" @alert="onAlert">
    </limit-approaching>

    <session-ended ref="sessionEndedPopup" :translations="config.translations" :session-status="sessionStatus"
        :min-stake="config.minStake" :balance="currentBalance" :suppressed="gameInProgress" :events="events">
    </session-ended>

    <help-component :translations="config.translations.help" :text="helpText" @update-help-text="onUpdateHelpText">
    </help-component>

</div>
