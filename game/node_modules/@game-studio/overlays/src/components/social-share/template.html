<div class="social-share" v-show="isVisible">
    <div class="modal">
        <div class="title-container">
            <div class="title">
                {{title}}
            </div>
            <div class="close" @click="onClose()"></div>
        </div>
        <img :src="image" class="image" />
        <div class="buttons">
            <div class="button" @click="onShare('Facebook')">
                <div class="logo facebook"></div>
                <div class="label">Facebook</div>
            </div>
            <div class="button" @click="onShare('Twitter')">
                <div class="logo twitter"></div>
                <div class="label">Twitter</div>
            </div>
            <div class="button" @click="onShare('WhatsApp')">
                <div class="logo whatsapp"></div>
                <div class="label">WhatsApp</div>
            </div>
        </div>
    </div>
</div>
