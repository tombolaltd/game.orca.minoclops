<div class="time-keeper" v-show="isVisible" :style="{ 
        '--themeFont': theme.fontName, 
        '--headingColor': headingColor,
        '--bodyColor': bodyColor,
    }">
    <div class="container">
        <h3 class="title">{{title}}</h3>
        <h2 class="text">{{text}}</h2>
        <button class="button button-transaction" :style="primaryButtonStyle" @click="onTransactions">View transaction
            history</button>
        <button class="button button-continue" :style="secondaryButtonStyle" @click="onContinue">Continue
            playing</button>
        <button class="button button-close" :style="tertiaryButtonStyle" @click="onClose">Close game</button>
    </div>
</div>
