<div class="time-limit-reached-window" v-show="isVisible"
:style="{ 
        '--themeFont': theme.fontName, 
        '--headingColor': headingColor,
        '--bodyColor': bodyColor,
    }">
    <div class="container">
        <h3 class="header">Time Limit reached</h3>
        <p class="message">You have reached your daily Time Limit. Time Limits reset every day at midnight</p>
        <button class="button" :style="primaryButtonStyle" @click="onClose">Continue</button>
    </div>
</div>
