<div id='wallet-container' class='arcade-session-it'>
    <div class='wallet-interaction-blocker'></div>
    <div class='wallet-close-button' :style="{ top: isFreePlay ? `calc(50% - 85px)` : 'calc(50% - 160px)' }" v-on:click='closeForm'></div>
    <div id="wallet-popup" class='wallet-popup' :style="{ zoom: viewportScale, '-moz-transform': `scale(${viewportScale})`, height: isFreePlay ? '150px' : '310px' }  ">
      <div class='current-balance balance-info'>
        <span class='left-item'>{{ translations.currentBalance }}</span>
        <span class='icon' v-if="isFreePlay" :style="{ backgroundImage: freePlayIconUrl }"></span>
        <span class='right-item'>{{ currentBalanceFormatted }}</span>
      </div>
      <div v-show="!isFreePlay" class='balance-selector'>
        <div class='balance-info'>
          <span class='left-item'>{{ translations.selectedBalance }}</span>
          <span class='right-item'>{{ selectedBalanceFormatted }}</span>
        </div>
        <div class="slider-container">
          <button :disabled='isMinusDisabled' ref="minusButton" class="minus-button" v-on:click="updateSliderValue(-1)"></button>
          <vue-slider :zoom="viewportScale" ref="slider" v-model="sliderValue" v-bind="options" v-on:change="sliderChange" v-on:drag-end="sliderChange" ></vue-slider>
          <button :disabled='isPlusDisabled' ref="plusButton" class="plus-button" v-on:click="updateSliderValue(1)"></button>
        </div>
        <div class='info-text'>{{ translations.infoText }}</div>
      </div>
      <div class='confirmation-buttons-container'>
        <button class='confirm-max-button' v-if="!isFreePlay" v-on:click='submitMax'></button>
        <button class='confirm-slider-button' v-bind:class="{ disabled: disabled }" :disabled='disabled' v-on:click='submitSelected'></button>
      </div>
    </div>
  </div>
