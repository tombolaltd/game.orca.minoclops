<div class="accordion" :class="{ 'expanded': isContentExpanded }" @click="onExpandContent()">
    <div class="label-container">
        <div class="label">
            {{ label }}
        </div>
        <div class="arrow">
            <menu-arrow :direction="isContentExpanded ? 'down' : 'right'"></menu-arrow>
        </div>
    </div>
    <!-- This padding is here to create a 10px gap between the label and expandable content.
     We can't just use flex gap as it creates additional padding at the bottom. Also, we can transition things like margins etc.
     so it jumped about and looked rubbish. THis is a hack, but it looks way better. -->
    <div class="padding"></div>
    <div class="content-wrapper">
        <div class="content">
            <slot></slot>
        </div>
    </div>
</div>
