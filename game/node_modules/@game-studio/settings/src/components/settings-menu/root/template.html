<div class="settings-menu" :class="{ visible: isVisible }" :style="{ '--themeColour': themeColour }" @transitionend="onTransitionEnd">
    <div class="header">
        <div class="logo-container">
            <slot name="logo"></slot>
        </div>
        <div class="close-icon" @click="onClose()">
            <svg-icon icon="cross"></svg-icon>
        </div>
    </div>
    <div class="content">
        <div class="settings-items">
            <slot></slot>
        </div>
        <div class="build-info">
            <div class="game-name">
                Version
            </div>
            <div class="version">
                {{ buildVersion }}
            </div>
        </div>
    </div>
    <settings-menu-sub-menu v-if="activeSubMenu" :title="subMenuLabel">
        <component :is="activeSubMenu.component" v-bind="subMenuProps"></component>
    </settings-menu-sub-menu>
</div>
